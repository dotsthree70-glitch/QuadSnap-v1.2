name: Build Android APK

on:
  push:
    branches: [ "main" ] # Triggers on push to the main branch
  pull_request:
    branches: [ "main" ] # Triggers on pull requests to the main branch
  workflow_dispatch:     # Allows you to trigger the build manually from GitHub

jobs:
  build:
    name: Compile and Assemble APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17 (required for modern Android builds)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Gradle and cache dependencies automatically
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Step 4: Grant execution permissions to the Gradle Wrapper script
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Step 5: Build the Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # Step 6: Save and upload the resulting APK as a GitHub Action Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7  # Retain the build artifact for 7 days
