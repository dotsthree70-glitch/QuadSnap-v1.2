name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile and Assemble Optimized APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Safely handle local .env configuration on the runner
      - name: Create Env Files
        run: |
          touch .env
          if [ ! -f .env.example ]; then
            echo "# Template" > .env.example
          fi

      # Generate a valid debug keystore on the runner to satisfy build requirements
      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Build the fully minified, optimized, and signed APK
      - name: Build Optimized APK
        run: gradle :app:assembleDebugOptimized --no-daemon

      # Upload the tiny, fast-installing APK as an artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-optimized-apk
          path: app/build/outputs/apk/debugOptimized/app-debugOptimized.apk
          if-no-files-found: error
          retention-days: 7
